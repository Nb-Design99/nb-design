<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fond 3 · Aurore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="base.css" />
  <style>
    /* ====== FOND 3 : AURORE ====== */
    .bg { background: #02070a; }
    /* les nappes bougent ensemble avec la souris (parallaxe douce) */
    .sky {
      position: absolute; inset: -15%;
      filter: blur(70px) saturate(1.15);
      transform: translate(var(--mx, 0px), var(--my, 0px));
      transition: transform 1.6s cubic-bezier(.2,.8,.2,1);
    }
    .blob { position: absolute; border-radius: 50%; mix-blend-mode: screen; }
    .b1 { width: 55vw; height: 45vw; left: 5%;  top: 10%; background: radial-gradient(circle, rgba(45,122,79,.85), transparent 65%); animation: d1 22s ease-in-out infinite alternate; }
    .b2 { width: 50vw; height: 50vw; right: 0;  top: 0;   background: radial-gradient(circle, rgba(20,60,110,.8), transparent 65%);  animation: d2 26s ease-in-out infinite alternate; }
    .b3 { width: 45vw; height: 40vw; left: 30%; bottom: 0; background: radial-gradient(circle, rgba(110,208,154,.45), transparent 65%); animation: d3 19s ease-in-out infinite alternate; }
    .b4 { width: 35vw; height: 35vw; right: 15%; bottom: 10%; background: radial-gradient(circle, rgba(16,120,110,.6), transparent 65%); animation: d4 24s ease-in-out infinite alternate; }
    .b5 { width: 30vw; height: 28vw; left: 0;   bottom: 15%; background: radial-gradient(circle, rgba(70,40,120,.45), transparent 65%); animation: d2 30s ease-in-out infinite alternate-reverse; }
    @keyframes d1 { to { transform: translate(22vw, 14vh) scale(1.2); } }
    @keyframes d2 { to { transform: translate(-20vw, 18vh) scale(.85); } }
    @keyframes d3 { to { transform: translate(-16vw, -22vh) scale(1.25); } }
    @keyframes d4 { to { transform: translate(-24vw, -10vh) scale(1.1); } }

    /* le centre reste plus sombre pour la lisibilité */
    .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 55% 50% at 50% 50%, rgba(2,7,10,.55), transparent 75%), linear-gradient(180deg, rgba(2,7,10,.5), transparent 25%, transparent 75%, rgba(2,7,10,.8)); }
    /* grain de film */
    .grain {
      position: absolute; inset: -50%; opacity: .09; pointer-events: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      animation: grain .9s steps(4) infinite;
    }
    @keyframes grain {
      0% { transform: translate(0, 0); } 25% { transform: translate(-3%, 2%); }
      50% { transform: translate(2%, -3%); } 75% { transform: translate(-2%, -1%); } 100% { transform: translate(0, 0); }
    }
    @media (prefers-reduced-motion: reduce) { .blob, .grain { animation: none !important; } }
  </style>
</head>
<body>
  <section class="hero">
    <div class="bg" aria-hidden="true">
      <div class="sky">
        <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
        <div class="blob b4"></div><div class="blob b5"></div>
      </div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>
  </section>

  <script src="common.js"></script>
  <script>
    (function () {
      var sky = document.querySelector('.sky');
      addEventListener('pointermove', function (e) {
        var x = (e.clientX / innerWidth - .5) * 60, y = (e.clientY / innerHeight - .5) * 40;
        sky.style.setProperty('--mx', x.toFixed(1) + 'px');
        sky.style.setProperty('--my', y.toFixed(1) + 'px');
      });
    })();
  </script>
</body>
</html>
