<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fond 1 · Mur de réalisations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="base.css" />
  <style>
    /* ====== FOND 1 : MUR DE RÉALISATIONS ====== */
    .wall {
      position: absolute; left: 50%; top: 50%;
      width: 190vw; height: 240vh;
      display: flex; gap: 22px; justify-content: center;
      transform: translate(-50%, -50%) perspective(1800px) rotateX(24deg) rotateZ(-12deg);
    }
    .col { flex: 0 0 auto; width: clamp(220px, 19vw, 360px); display: flex; flex-direction: column; gap: 22px; }
    .col.up   { animation: up 70s linear infinite; }
    .col.down { animation: down 70s linear infinite; }
    @keyframes up   { from { transform: translateY(0); }    to { transform: translateY(-50%); } }
    @keyframes down { from { transform: translateY(-50%); } to { transform: translateY(0); } }
    .col img {
      display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover;
      border-radius: 10px; border: 1px solid rgba(248,246,241,.10);
      box-shadow: 0 20px 50px rgba(0,0,0,.5);
      opacity: .6; filter: saturate(.85);
    }
    /* voile : le centre reste sombre pour que le titre se lise */
    .veil {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 60% 55% at 50% 50%, rgba(3,10,6,.92) 0%, rgba(3,10,6,.78) 45%, rgba(3,10,6,.35) 100%),
        linear-gradient(180deg, rgba(3,10,6,.85) 0%, transparent 18%, transparent 80%, rgba(3,10,6,.95) 100%);
    }
    .tint { position: absolute; inset: 0; background: var(--green-deep); mix-blend-mode: color; opacity: .35; }
    @media (prefers-reduced-motion: reduce) { .col { animation: none !important; } }
  </style>
</head>
<body>
  <section class="hero">
    <div class="bg" aria-hidden="true">
      <div class="wall"></div>
      <div class="tint"></div>
      <div class="veil"></div>
    </div>
  </section>

  <script src="common.js"></script>
  <script>
    (function () {
      var shots = ['Udrisard','LaTaverne','GoubingChezPino','Oasis','VacheEtMoi','EnclosDeValere',
        'LaBotte','Borsalino','CaveauPDA','PalaisDesPetitsCochons','LesVergers','CafeUnionSaviese',
        'LeBSportbar','OsteriaDelSole','Mezzes','LeSultan','Bosphorus','ColoniaItaliana'];
      var wall = document.querySelector('.wall'), COLS = 7, PER = 6;
      for (var c = 0; c < COLS; c++) {
        var col = document.createElement('div');
        col.className = 'col ' + (c % 2 ? 'down' : 'up');
        col.style.animationDuration = (60 + c * 6) + 's';
        var list = [];
        for (var i = 0; i < PER; i++) list.push(shots[(c * 5 + i * 3) % shots.length]);
        // doublée pour une boucle sans couture
        list.concat(list).forEach(function (n) {
          var img = new Image();
          img.src = 'shots/' + n + '.jpg'; img.alt = ''; img.loading = 'eager';
          col.appendChild(img);
        });
        wall.appendChild(col);
      }
    })();
  </script>
</body>
</html>
