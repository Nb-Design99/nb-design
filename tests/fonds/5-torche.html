<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fond 5 · Lampe torche</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="base.css" />
  <style>
    /* ====== FOND 5 : LAMPE TORCHE ====== */
    .bg { background: #020604; --x: 50%; --y: 45%; }
    .sketch { position: absolute; inset: 0; width: 100%; height: 100%; }
    .sketch .ln { fill: none; stroke: #6ed09a; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .sketch .fl { fill: #6ed09a; }
    .sketch .hand { font-family: 'Caveat', cursive; font-size: 19px; fill: #e6c875; }
    .sketch .hand-ln { fill: none; stroke: #e6c875; stroke-width: 1.2; stroke-linecap: round; }
    /* partout : à peine visible */
    .dim { opacity: .035; }
    /* sous la lampe : les croquis apparaissent */
    .lit {
      opacity: .85;
      -webkit-mask-image: radial-gradient(circle var(--r, 260px) at var(--x) var(--y), #000 0%, rgba(0,0,0,.55) 45%, transparent 100%);
              mask-image: radial-gradient(circle var(--r, 260px) at var(--x) var(--y), #000 0%, rgba(0,0,0,.55) 45%, transparent 100%);
    }
    .halo {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(circle 320px at var(--x) var(--y), rgba(76,175,120,.14), transparent 70%);
    }
    /* le titre reste lisible même quand la lampe passe dessous */
    .shade { position: absolute; inset: 0; background: radial-gradient(ellipse 42% 32% at 50% 50%, rgba(2,6,4,.65), transparent 80%); pointer-events: none; }
    @media (max-width: 700px) { .bg { --r: 170px; } }
  </style>
</head>
<body>
  <section class="hero">
    <div class="bg" aria-hidden="true">
      <svg class="sketch dim"><rect width="100%" height="100%" fill="url(#maquettes)" /></svg>
      <svg class="sketch lit">
        <defs>
          <!-- un carreau de croquis : maquette de site, menu, téléphone, annotations -->
          <pattern id="maquettes" width="560" height="380" patternUnits="userSpaceOnUse">
            <!-- fenêtre de navigateur -->
            <rect class="ln" x="20" y="24" width="250" height="170" rx="8" />
            <line class="ln" x1="20" y1="44" x2="270" y2="44" />
            <circle class="fl" cx="32" cy="34" r="3" /><circle class="fl" cx="42" cy="34" r="3" /><circle class="fl" cx="52" cy="34" r="3" />
            <rect class="ln" x="32" y="56" width="110" height="78" rx="4" />
            <line class="ln" x1="32" y1="56" x2="142" y2="134" /><line class="ln" x1="142" y1="56" x2="32" y2="134" />
            <line class="ln" x1="156" y1="62" x2="250" y2="62" style="stroke-width:3" />
            <line class="ln" x1="156" y1="78" x2="240" y2="78" /><line class="ln" x1="156" y1="90" x2="232" y2="90" />
            <line class="ln" x1="156" y1="102" x2="244" y2="102" />
            <rect class="ln" x="156" y="116" width="62" height="18" rx="9" />
            <line class="ln" x1="32" y1="150" x2="258" y2="150" /><line class="ln" x1="32" y1="162" x2="220" y2="162" />
            <line class="ln" x1="32" y1="174" x2="240" y2="174" />
            <!-- annotation -->
            <path class="hand-ln" d="M230 140 C 262 160, 282 200, 300 214" />
            <path class="hand-ln" d="M222 132 l 10 8 l -12 2" />
            <text class="hand" x="276" y="234">bouton « réserver »</text>

            <!-- carte du restaurant -->
            <rect class="ln" x="340" y="20" width="190" height="200" rx="6" />
            <text class="hand" x="398" y="50" style="font-size:24px;fill:#6ed09a">La carte</text>
            <line class="ln" x1="360" y1="62" x2="510" y2="62" />
            <g>
              <line class="ln" x1="360" y1="86" x2="430" y2="86" /><line class="ln" x1="436" y1="86" x2="486" y2="86" style="stroke-dasharray:2 5" /><text class="hand" x="490" y="91" style="fill:#6ed09a">24.–</text>
              <line class="ln" x1="360" y1="114" x2="420" y2="114" /><line class="ln" x1="426" y1="114" x2="486" y2="114" style="stroke-dasharray:2 5" /><text class="hand" x="490" y="119" style="fill:#6ed09a">32.–</text>
              <line class="ln" x1="360" y1="142" x2="440" y2="142" /><line class="ln" x1="446" y1="142" x2="486" y2="142" style="stroke-dasharray:2 5" /><text class="hand" x="490" y="147" style="fill:#6ed09a">18.–</text>
              <line class="ln" x1="360" y1="170" x2="414" y2="170" /><line class="ln" x1="420" y1="170" x2="486" y2="170" style="stroke-dasharray:2 5" /><text class="hand" x="490" y="175" style="fill:#6ed09a">29.–</text>
            </g>
            <line class="ln" x1="360" y1="196" x2="510" y2="196" />

            <!-- téléphone -->
            <rect class="ln" x="60" y="236" width="86" height="130" rx="14" />
            <line class="ln" x1="90" y1="246" x2="116" y2="246" />
            <rect class="ln" x="70" y="258" width="66" height="44" rx="3" />
            <line class="ln" x1="70" y1="314" x2="130" y2="314" /><line class="ln" x1="70" y1="324" x2="118" y2="324" />
            <rect class="ln" x="76" y="338" width="54" height="14" rx="7" />
            <text class="hand" x="160" y="300">version mobile ✓</text>

            <!-- palette & typo -->
            <circle class="ln" cx="370" cy="270" r="14" /><circle class="ln" cx="404" cy="270" r="14" /><circle class="ln" cx="438" cy="270" r="14" />
            <text class="hand" x="460" y="276">palette</text>
            <text x="360" y="336" style="font-family:'Cormorant Garamond',serif;font-size:40px;font-style:italic;fill:none;stroke:#6ed09a;stroke-width:.8">Aa</text>
            <text class="hand" x="420" y="330">typo élégante</text>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#maquettes)" />
      </svg>
      <div class="halo"></div>
      <div class="shade"></div>
    </div>
  </section>

  <script src="common.js"></script>
  <script>
    (function () {
      var bg = document.querySelector('.bg');
      var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
      var target = { x: innerWidth * .3, y: innerHeight * .4 }, pos = { x: target.x, y: target.y }, lastMove = -1e9;
      addEventListener('pointermove', function (e) {
        if (e.pointerType === 'touch') return;
        target.x = e.clientX; target.y = e.clientY; lastMove = performance.now();
      });
      function frame(now) {
        // sans souris (mobile, ou souris immobile), la lampe se promène seule
        if (now - lastMove > 2500) {
          var t = now / 1000;
          target.x = innerWidth * (.5 + .36 * Math.sin(t * .4));
          target.y = innerHeight * (.5 + .3 * Math.sin(t * .62 + 2));
        }
        pos.x += (target.x - pos.x) * .09; pos.y += (target.y - pos.y) * .09;
        bg.style.setProperty('--x', pos.x.toFixed(1) + 'px');
        bg.style.setProperty('--y', pos.y.toFixed(1) + 'px');
        if (!still) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
